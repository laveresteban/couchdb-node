# Tests, the shared conformance suite and the generated-code drift check all
# come from couchdb-sdk-generator; see its .github/workflows/sdk-ci.yml.
name: ci
on:
  pull_request:
  push:
    branches: [main]
  # Lets CI be started by hand, e.g. after sdk-ci.yml changes upstream:
  # a run that failed because the shared workflow was missing can't be retried.
  workflow_dispatch:

jobs:
  ci:
    uses: laveresteban/couchdb-sdk-generator/.github/workflows/sdk-ci.yml@main
    with:
      language: node
      matrix-key: typescript
      versions: '["18", "20", "22"]'
      conformance-version: "20"
      install: npm ci && npm run build
      test: node scripts/sync-version.mjs --check && npm test
